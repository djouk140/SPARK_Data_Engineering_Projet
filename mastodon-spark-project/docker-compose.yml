services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: mastodon-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      - kafka
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mastodon_stream}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2;
        done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic "$$KAFKA_TOPIC"
        --partitions 1 --replication-factor 1
    restart: "no"

  postgres:
    image: postgres:16
    container_name: mastodon-postgres
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: mastodon_db
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon -d mastodon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark-streaming:
    build:
      context: ..
      dockerfile: mastodon-spark-project/Dockerfile.spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4050:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-mastodon_stream}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mastodon_db}
      POSTGRES_USER: ${POSTGRES_USER:-mastodon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      SPARK_CHECKPOINT_DIR: /opt/spark-checkpoints
      SPARK_KAFKA_CONNECTOR_VERSION: 4.2.0
      SPARK_LOCAL_IP: spark-streaming
      SPARK_UI_HOST: 0.0.0.0
      SPARK_UI_BIND_ADDRESS: 0.0.0.0
    volumes:
      - spark_checkpoints:/opt/spark-checkpoints
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
  spark_checkpoints: